<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chez Nous Chez Vous — Luxury Apartment Booking</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff7b00;
      --secondary: #ffb347;
      --bg-overlay: rgba(255, 255, 255, 0.65);
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(255, 255, 255, 0.35);
      --text-dark: #2b2b2b;
      --shadow: rgba(0, 0, 0, 0.2);
      --radius: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
      position: relative;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.55));
      z-index: 0;
      backdrop-filter: blur(10px);
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px var(--shadow);
      padding: 50px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1s ease forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text-dark);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    h1 span {
      color: var(--primary);
    }

    p {
      color: #555;
      margin-bottom: 32px;
      font-size: 0.96rem;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      text-align: left;
      font-weight: 500;
      color: #444;
      font-size: 0.92rem;
    }

    input {
      padding: 13px 15px;
      border: 1px solid rgba(255, 123, 0, 0.3);
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.85);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(255, 123, 0, 0.4);
      outline: none;
      background: #fff;
    }

    .price-display {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 123, 0, 0.25);
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      color: var(--primary);
      font-size: 1.05rem;
      transition: transform 0.3s;
    }

    .price-display:hover {
      transform: scale(1.02);
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(255, 123, 0, 0.35);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(255, 123, 0, 0.5);
    }

    footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 520px) {
      body {
        padding: 40px 15px;
      }
      .container {
        padding: 35px 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>Chez Nous</span> Chez Vous</h1>
    <p>Experience true elegance — where modern comfort meets timeless luxury.</p>

    <form id="bookingForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="Enter your full name">

      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="Enter your email">

      <label for="checkIn">Check-in Date</label>
      <input type="date" id="checkIn" required>

      <label for="checkOut">Check-out Date</label>
      <input type="date" id="checkOut" required>

      <div class="price-display" id="priceDisplay">Total: ₦0 (0 nights)</div>

      <button type="submit">Confirm & Pay Securely</button>
    </form>

    <footer>© 2025 Chez Nous Chez Vous Apartments. All rights reserved.</footer>
  </div>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script>
    const form = document.getElementById('bookingForm');
    const priceDisplay = document.getElementById('priceDisplay');
    const ratePerNight = 100000; // Example rate

    function calculateNights() {
      const checkIn = new Date(document.getElementById('checkIn').value);
      const checkOut = new Date(document.getElementById('checkOut').value);
      const diff = checkOut - checkIn;
      if (diff <= 0) return { nights: 0, total: 0 };
      const nights = diff / (1000 * 60 * 60 * 24);
      return { nights, total: nights * ratePerNight };
    }

    document.getElementById('checkIn').addEventListener('change', updatePrice);
    document.getElementById('checkOut').addEventListener('change', updatePrice);

    function updatePrice() {
      const { nights, total } = calculateNights();
      priceDisplay.textContent = `Total: ₦${total.toLocaleString()} (${nights} night${nights > 1 ? 's' : ''})`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { nights, total } = calculateNights();
      if (nights <= 0) return alert("Please select valid dates.");

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        checkIn: document.getElementById('checkIn').value,
        checkOut: document.getElementById('checkOut').value,
        amount: total
      };

      try {
        const response = await fetch('https://api-p-five.vercel.app/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (result.status === 'success') {
          const handler = PaystackPop.setup({
            key: result.publicKey,
            email: data.email,
            amount: total * 100,
            currency: 'NGN',
            callback: function(response) {
              alert('Payment successful! Reference: ' + response.reference);
            },
            onClose: function() {
              alert('Transaction cancelled.');
            }
          });
          handler.openIframe();
        } else {
          alert('Payment initialization failed: ' + (result.message || 'Unknown error'));
        }
      } catch (err) {
        console.error(err);
        alert('Error initializing payment.');
      }
    });
  </script>
</body>
</html>
